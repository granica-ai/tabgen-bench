[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tabgen-bench"
version = "0.1.0"
description = "TabGenBench: 28 selected BeyondArena tables with pinned sources, stored splits and verified preprocessing, for tabular data generation"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Granica Research Team" }]
keywords = ["tabular data", "synthetic data", "benchmark", "generative models"]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "huggingface_hub>=0.23",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
tabgen-bench = "tabgen_bench.__main__:main"

[tool.setuptools.packages.find]
include = ["tabgen_bench*"]

[tool.setuptools.package-data]
tabgen_bench = ["table_sources/*/*.json", "table_sources/*/*.parquet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["data: needs the downloaded BeyondArena tables (TABGEN_BENCH_DATA)"]
